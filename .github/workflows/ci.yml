# CI for the Expense Tracker (Assignment 2, Sharon Johnson)
# Runs on every pull request into main. Node 22 because Vitest 5 requires Node 22.12 or newer.
# Two jobs run side by side:
#   backend:  install -> lint -> prepare database -> run the test suite
#   frontend: install -> type-check and build (the frontend has no tests yet)
name: CI

on:
  pull_request:
    branches: [main]

# The workflow only needs to read the code, never change it.
permissions:
  contents: read

jobs:
  backend:
    name: Backend - install, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The database tests (seed repeatability, edit verification) need PostgreSQL.
    # This starts a throwaway PostgreSQL 16 container that exists only during this run.
    # The username and password are CI-only test values, not real secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: expense_tracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d expense_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/expense_tracker_ci?schema=public

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database tables
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend - install, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Test (if configured)
        run: npm test --if-present

      - name: Build (type-check + bundle)
        run: npm run build
